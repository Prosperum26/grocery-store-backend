# Pinger giữ Render free không ngủ (Render free tắt service sau 15 phút không có request).
# Gọi mỗi 10 phút, chỉ trong khung 06:00–23:59 giờ VN (UTC 23:00–16:59) để không vượt
# 750 giờ chạy miễn phí mỗi tháng của Render (một service chạy 24/7 đã gần hết 750 giờ).
#
# Cấu hình: Settings > Secrets and variables > Actions > Variables > PING_URLS
# (cách nhau bằng dấu cách), ví dụ:
#   https://com4fud-backend.onrender.com/health
#
# Lưu ý của GitHub: lịch (schedule) chỉ chạy trên nhánh mặc định (main), có thể trễ vài phút,
# và tự tắt nếu repo public không có hoạt động 60 ngày.
name: Keep alive

on:
  schedule:
    - cron: "*/10 23,0-16 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping services
        env:
          PING_URLS: ${{ vars.PING_URLS }}
        run: |
          if [ -z "$PING_URLS" ]; then
            echo "PING_URLS chưa được đặt, bỏ qua."
            exit 0
          fi
          for url in $PING_URLS; do
            # Service đang ngủ cần ~1 phút để dậy, nên cho chờ tới 120 giây.
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 "$url" || echo "000")
            echo "$url -> $code"
          done
